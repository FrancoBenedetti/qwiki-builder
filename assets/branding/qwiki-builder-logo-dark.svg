<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Ring Gradient tuned for Dark Theme -->
    <linearGradient id="q-ring-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Tail Rocket Gradient -->
    <linearGradient id="q-tail-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <filter id="logo-shadow-dark" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left: Emblem / Mark (Scaled & centered within 220x220) -->
  <g transform="translate(20, 20)">
    <!-- Outer Orbit Ring of the 'Q' -->
    <circle cx="110" cy="110" r="76" fill="none" stroke="url(#q-ring-dark)" stroke-width="17" stroke-linecap="round" filter="url(#logo-shadow-dark)" />

    <!-- Open Document Pages inside the Q -->
    <g transform="translate(110, 110)">
      <!-- Left Page: Dark slate layer with stroke -->
      <path d="M-3 18 C-18 12 -38 13 -54 20 L-54 -34 C-38 -41 -18 -40 -3 -34 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Right Page: Slate layer with stroke -->
      <path d="M3 18 C18 12 38 13 54 20 L54 -34 C38 -41 18 -40 3 -34 Z" fill="#334155" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M0 -36 L0 20" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

      <!-- Page text lines -->
      <line x1="-44" y1="-22" x2="-14" y2="-26" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
      <line x1="-44" y1="-10" x2="-20" y2="-13" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="-26" x2="44" y2="-22" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="-13" x2="38" y2="-10" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

      <!-- Small AI Sparkle -->
      <path d="M0 -46 L2 -53 L9 -55 L2 -57 L0 -64 L-2 -57 L-9 -55 L-2 -53 Z" fill="#38BDF8" />
    </g>

    <!-- Q Tail Deployment Rocket / Wedge -->
    <g>
      <path d="M150 150 L204 204 L190 212 L164 210 L136 182 Z" fill="url(#q-tail-dark)" />
      <polygon points="166,166 186,168 162,192" fill="#FDE047" />
      <circle cx="208" cy="208" r="4.5" fill="#FDE047" />
      <circle cx="218" cy="218" r="3" fill="#F97316" />
    </g>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(280, 0)">
    <!-- Main Title "Qwiki" + "Builder" -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Qwiki</tspan><tspan fill="#818CF8">Builder</tspan>
    </text>

    <!-- Tagline / Subtitle Pill -->
    <g transform="translate(2, 160)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
        DOCUMENTATION ENGINE
      </text>

      <text x="240" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
        Automated Manuals &amp; Wiki Deployment
      </text>
    </g>
  </g>
</svg>
