<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Ring / Q Loop Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Document Pages Gradient -->
    <linearGradient id="doc-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="doc-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Builder / Rocket Accent (Q Tail) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Subtle Drop Shadows & Glows -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>

    <filter id="accent-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F97316" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="#334155" stroke-width="3" />

  <!-- Subtle Blueprint / Grid Lines in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2">
    <line x1="24" y1="140" x2="488" y2="140" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <line x1="24" y1="372" x2="488" y2="372" />
    <line x1="140" y1="24" x2="140" y2="488" />
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="372" y1="24" x2="372" y2="488" />
  </g>

  <!-- Outer Orbit Ring of the 'Q' -->
  <circle cx="240" cy="232" r="144" fill="none" stroke="url(#primary-glow)" stroke-width="28" stroke-linecap="round" filter="url(#glow-shadow)" />

  <!-- Central Open Wiki Document / Manual Book -->
  <g transform="translate(240, 230)">
    <!-- Left Document Page -->
    <path d="M-6 32 C-34 22 -68 24 -96 36 L-96 -64 C-68 -74 -34 -72 -6 -60 Z" fill="url(#doc-grad-left)" />
    <!-- Right Document Page -->
    <path d="M6 32 C34 22 68 24 96 36 L96 -64 C68 -74 34 -72 6 -60 Z" fill="url(#doc-grad-right)" />
    <!-- Document Center Spine -->
    <path d="M0 -66 L0 34" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    
    <!-- Code / Text Line Marks on Pages -->
    <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <!-- Left Page Lines -->
      <line x1="-80" y1="-40" x2="-24" y2="-48" />
      <line x1="-80" y1="-18" x2="-36" y2="-24" />
      <line x1="-80" y1="4" x2="-24" y2="-2" />
      <!-- Right Page Lines -->
      <line x1="24" y1="-48" x2="80" y2="-40" stroke="#38BDF8" />
      <line x1="24" y1="-24" x2="68" y2="-18" />
      <line x1="24" y1="-2" x2="80" y2="4" />
    </g>

    <!-- Top Floating AI / Build Sparkle -->
    <path d="M0 -86 L4 -98 L16 -102 L4 -106 L0 -118 L-4 -106 L-16 -102 L-4 -98 Z" fill="#38BDF8" opacity="0.9" />
  </g>

  <!-- The Dynamic 'Q' Tail: A High-Speed Deployment Rocket / Builder Wedge -->
  <g filter="url(#accent-shadow)">
    <!-- Main Rocket / Wedge Arrow breaking outward through the Q ring -->
    <path d="M312 304 L408 400 L382 414 L338 410 L286 358 Z" fill="url(#accent-grad)" />
    <!-- Speed Wings / Fin Layers -->
    <polygon points="340,332 376,336 332,380" fill="#FDE047" opacity="0.9" />
    <!-- Thrust Trail -->
    <circle cx="414" cy="406" r="8" fill="#FDE047" />
    <circle cx="434" cy="426" r="5" fill="#F97316" />
    <circle cx="448" cy="440" r="3" fill="#EF4444" opacity="0.7" />
  </g>
</svg>
